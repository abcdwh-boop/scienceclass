<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 컬러 피커 (Web Color Picker)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#64748b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 알림 메시지 애니메이션 */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 팔레트 아이템 효과 */
        .palette-color {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            cursor: pointer;
        }
        .palette-color:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .palette-color:active { transform: scale(0.95); }

        /* 커스텀 피커 썸네일(조작부) 그림자 디테일 */
        .picker-thumb-shadow {
            box-shadow: 0 0 0 1.5px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 text-indigo-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">웹 컬러 피커</h1>
            </div>
            <p class="text-sm text-slate-500 hidden sm:block">드래그 앤 드롭 커스텀 색상 선택기</p>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- 왼쪽 패널: 커스텀 컬러 피커 및 팔레트 -->
        <section class="flex-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col space-y-5">
                <h2 class="text-lg font-semibold text-slate-800">색상 직접 선택</h2>
                
                <!-- 채도/명도(SV) 맵 캔버스 -->
                <div class="relative w-full h-56 md:h-64 rounded-xl overflow-hidden shadow-inner border border-slate-200 touch-none cursor-crosshair" id="svContainer">
                    <canvas id="svCanvas" class="w-full h-full block"></canvas>
                    <div id="svThumb" class="absolute w-5 h-5 -ml-2.5 -mt-2.5 border-[2px] border-white rounded-full pointer-events-none z-10 box-border picker-thumb-shadow"></div>
                </div>

                <!-- 색조(Hue) 슬라이더 -->
                <div class="relative w-full h-6 rounded-full shadow-inner border border-slate-200 touch-none cursor-pointer mt-2" id="hueSlider" style="background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);">
                    <div id="hueThumb" class="absolute top-1/2 -translate-y-1/2 w-6 h-6 -ml-3 bg-white border border-slate-300 rounded-full pointer-events-none z-10 box-border picker-thumb-shadow"></div>
                </div>

                <!-- 현재 선택된 색상 미리보기 -->
                <div class="flex items-center gap-4 pt-4 border-t border-slate-100">
                    <div id="colorPreview" class="w-14 h-14 rounded-xl shadow-inner border border-slate-200 transition-colors" style="background-color: #4f46e5;"></div>
                    <div class="flex-grow">
                        <p class="text-lg font-bold text-slate-800" id="previewHexText">#4F46E5</p>
                        <p class="text-sm text-slate-500" id="previewRgbText">rgb(79, 70, 229)</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">추천 색상 팔레트</h2>
                <div class="space-y-4">
                    <div>
                        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">기본 컬러</h3>
                        <div class="flex flex-wrap gap-2" id="basicPalette"></div>
                    </div>
                    <div>
                        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">파스텔 톤</h3>
                        <div class="flex flex-wrap gap-2" id="pastelPalette"></div>
                    </div>
                    <div>
                        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">어두운 톤</h3>
                        <div class="flex flex-wrap gap-2" id="darkPalette"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="flex-1 md:max-w-md w-full space-y-4">
            <!-- HEX 코드 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 group hover:border-indigo-300 transition-colors">
                <label for="hexInput" class="block text-sm font-semibold text-slate-600 mb-2">HEX</label>
                <div class="flex relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-mono text-lg">#</span>
                    <input type="text" id="hexInput" class="block w-full pl-8 pr-12 py-3 rounded-lg border-slate-300 bg-slate-50 text-slate-800 font-mono text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-colors" value="4F46E5" placeholder="000000">
                    <button onclick="copyToClipboard('hex')" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors" title="HEX 코드 복사" aria-label="복사">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <!-- RGB 코드 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 group hover:border-blue-300 transition-colors">
                <label for="rgbInput" class="block text-sm font-semibold text-slate-600 mb-2">RGB</label>
                <div class="flex relative">
                    <input type="text" id="rgbInput" class="block w-full pl-4 pr-12 py-3 rounded-lg border-slate-300 bg-slate-50 text-slate-800 font-mono focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-colors" value="rgb(79, 70, 229)">
                    <button onclick="copyToClipboard('rgb')" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <!-- HSL 코드 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 group hover:border-green-300 transition-colors">
                <label for="hslInput" class="block text-sm font-semibold text-slate-600 mb-2">HSL</label>
                <div class="flex relative">
                    <input type="text" id="hslInput" class="block w-full pl-4 pr-12 py-3 rounded-lg border-slate-300 bg-slate-50 text-slate-800 font-mono focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white transition-colors" value="hsl(243, 76%, 59%)">
                    <button onclick="copyToClipboard('hsl')" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded-md transition-colors">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <!-- HSV 코드 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 group hover:border-amber-300 transition-colors">
                <label for="hsvInput" class="block text-sm font-semibold text-slate-600 mb-2">HSV / HSB</label>
                <div class="flex relative">
                    <input type="text" id="hsvInput" readonly class="block w-full pl-4 pr-12 py-3 rounded-lg border-slate-200 bg-slate-50 text-slate-600 font-mono cursor-default" value="hsv(243, 69%, 90%)">
                    <button onclick="copyToClipboard('hsv')" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-md transition-colors">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100 flex justify-between items-center mt-4">
                <span class="text-sm text-indigo-800 font-medium">CSS 호환</span>
                <span id="cssColorName" class="text-sm font-mono font-bold text-indigo-900 bg-white px-2 py-1 rounded shadow-sm">#4f46e5</span>
            </div>
        </section>
    </main>

    <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p class="text-sm">웹 컬러 피커 &copy; 2026. All rights reserved.</p>
        </div>
    </footer>

    <!-- 복사 알림 토스트 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // DOM 요소
        const svCanvas = document.getElementById('svCanvas');
        const svCtx = svCanvas.getContext('2d');
        const svThumb = document.getElementById('svThumb');
        const hueSlider = document.getElementById('hueSlider');
        const hueThumb = document.getElementById('hueThumb');
        
        const colorPreview = document.getElementById('colorPreview');
        const previewHexText = document.getElementById('previewHexText');
        const previewRgbText = document.getElementById('previewRgbText');
        
        const hexInput = document.getElementById('hexInput');
        const rgbInput = document.getElementById('rgbInput');
        const hslInput = document.getElementById('hslInput');
        const hsvInput = document.getElementById('hsvInput');
        const cssColorName = document.getElementById('cssColorName');

        // 커스텀 피커의 기준이 되는 내부 상태 (HSV 모델 사용이 가장 안정적임)
        let colorState = { h: 243, s: 0.69, v: 0.90 }; 

        // 색상 변환 유틸리티
        function hsvToRgb(h, s, v) {
            let r, g, b;
            let i = Math.floor(h / 60);
            let f = h / 60 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return {
                r: Math.round(r * 255),
                g: Math.round(g * 255),
                b: Math.round(b * 255)
            };
        }

        function rgbToHsv(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            let d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) {
                h = 0; // 무채색
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s, v: v };
        }

        function rgbToHex(r, g, b) {
            return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function hexToRgb(hex) {
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) hex = hex.split('').map(char => char + char).join('');
            const bigint = parseInt(hex, 16);
            return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
        }

        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        // SV 캔버스 그리기 (배경색 + 흰색/검은색 그라데이션)
        function drawSVMap() {
            const width = svCanvas.width;
            const height = svCanvas.height;

            // 배경 Base 색상 (Hue 기준)
            svCtx.fillStyle = `hsl(${colorState.h}, 100%, 50%)`;
            svCtx.fillRect(0, 0, width, height);

            // 좌->우 : 흰색 투명 그라데이션 (채도)
            let whiteGrad = svCtx.createLinearGradient(0, 0, width, 0);
            whiteGrad.addColorStop(0, 'rgba(255,255,255,1)');
            whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
            svCtx.fillStyle = whiteGrad;
            svCtx.fillRect(0, 0, width, height);

            // 하->상 : 검은색 투명 그라데이션 (명도)
            let blackGrad = svCtx.createLinearGradient(0, 0, 0, height);
            blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
            blackGrad.addColorStop(1, 'rgba(0,0,0,1)');
            svCtx.fillStyle = blackGrad;
            svCtx.fillRect(0, 0, width, height);
        }

        // 조작 썸네일 위치 및 색상 업데이트
        function updateThumbs() {
            // 위치 계산 (비율 사용으로 반응형 완벽 대응)
            const sPercent = colorState.s * 100;
            const vPercent = (1 - colorState.v) * 100;
            svThumb.style.left = `${sPercent}%`;
            svThumb.style.top = `${vPercent}%`;
            
            const hPercent = (colorState.h / 360) * 100;
            hueThumb.style.left = `${hPercent}%`;

            // 썸네일 색상 업데이트 (가시성 향상)
            const rgb = hsvToRgb(colorState.h, colorState.s, colorState.v);
            svThumb.style.backgroundColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            hueThumb.style.backgroundColor = `hsl(${colorState.h}, 100%, 50%)`;
        }

        // 전체 UI 동기화 업데이트
        function syncUI(source = 'picker') {
            const rgb = hsvToRgb(colorState.h, colorState.s, colorState.v);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
            const hexHash = '#' + hex;
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);

            // 프리뷰 업데이트
            colorPreview.style.backgroundColor = hexHash;
            previewHexText.textContent = hexHash;
            previewRgbText.textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            cssColorName.textContent = hexHash;

            // 입력 필드 업데이트 (현재 입력 중인 필드는 건너뜀)
            if (source !== 'hex') hexInput.value = hex;
            if (source !== 'rgb') rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            if (source !== 'hsl') hslInput.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            
            hsvInput.value = `hsv(${Math.round(colorState.h)}, ${Math.round(colorState.s * 100)}%, ${Math.round(colorState.v * 100)}%)`;

            // 외부 입력으로 변경되었을 경우 캔버스 갱신
            if (source !== 'picker') drawSVMap();
            updateThumbs();
        }

        let isDraggingSV = false;
        let isDraggingHue = false;

        function getMousePos(e, element) {
            const rect = element.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.max(0, Math.min(clientX - rect.left, rect.width)),
                y: Math.max(0, Math.min(clientY - rect.top, rect.height)),
                width: rect.width,
                height: rect.height
            };
        }

        function handleSVMove(e) {
            if (!isDraggingSV) return;
            const pos = getMousePos(e, svCanvas);
            colorState.s = pos.x / pos.width;
            colorState.v = 1 - (pos.y / pos.height);
            syncUI('picker');
        }

        function handleHueMove(e) {
            if (!isDraggingHue) return;
            const pos = getMousePos(e, hueSlider);
            colorState.h = (pos.x / pos.width) * 360;
            drawSVMap();
            syncUI('picker');
        }

        // SV 맵 이벤트
        svCanvas.addEventListener('mousedown', (e) => { isDraggingSV = true; handleSVMove(e); });
        svCanvas.addEventListener('touchstart', (e) => { isDraggingSV = true; handleSVMove(e); }, {passive: true});

        // Hue 슬라이더 이벤트
        hueSlider.addEventListener('mousedown', (e) => { isDraggingHue = true; handleHueMove(e); });
        hueSlider.addEventListener('touchstart', (e) => { isDraggingHue = true; handleHueMove(e); }, {passive: true});

        // 전역 이동/종료 이벤트
        window.addEventListener('mousemove', (e) => {
            if (isDraggingSV) handleSVMove(e);
            if (isDraggingHue) handleHueMove(e);
        });
        window.addEventListener('touchmove', (e) => {
            if (isDraggingSV) handleSVMove(e);
            if (isDraggingHue) handleHueMove(e);
        }, {passive: true});

        window.addEventListener('mouseup', () => { isDraggingSV = false; isDraggingHue = false; });
        window.addEventListener('touchend', () => { isDraggingSV = false; isDraggingHue = false; });

        // 캔버스 크기 조정 대응
        window.addEventListener('resize', () => {
            svCanvas.width = svCanvas.offsetWidth;
            svCanvas.height = svCanvas.offsetHeight;
            drawSVMap();
        });


        // 외부 입력(Hex, 팔레트 등) 처리 함수
        function updateFromExternalCode(hexValue, source) {
            let validHex = hexValue.replace(/^#/, '');
            if (!/^[0-9A-Fa-f]{3}$|^[0-9A-Fa-f]{6}$/.test(validHex)) return;
            
            const rgb = hexToRgb(validHex);
            const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
            
            // 검은색/흰색 등 무채색 선택 시 Hue 값이 0으로 초기화되는 것 방지
            if (hsv.s !== 0) {
                colorState.h = hsv.h;
            }
            colorState.s = hsv.s;
            colorState.v = hsv.v;
            
            syncUI(source);
        }

        hexInput.addEventListener('input', (e) => {
            if (e.target.value.length === 3 || e.target.value.length === 6) {
                updateFromExternalCode(e.target.value, 'hex');
            }
        });

        // RGB / HSL 문자열 파싱 (기존 로직 동일)
        function parseRgbString(str) {
            const match = str.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
            return match ? { r: Math.min(255, match[1]), g: Math.min(255, match[2]), b: Math.min(255, match[3]) } : null;
        }
        rgbInput.addEventListener('change', (e) => {
            const rgb = parseRgbString(e.target.value);
            if (rgb) updateFromExternalCode(rgbToHex(rgb.r, rgb.g, rgb.b), 'rgb');
        });

        const palettes = {
            basic: ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#f43f5e'],
            pastel: ['#fecaca', '#fed7aa', '#fde68a', '#fef08a', '#d9f99d', '#bbf7d0', '#a7f3d0', '#99f6e4', '#a5f3fc', '#bae6fd', '#bfdbfe', '#c7d2fe', '#ddd6fe', '#e9d5ff', '#fbcfe8', '#fecdd3'],
            dark: ['#7f1d1d', '#7c2d12', '#78350f', '#713f12', '#3f6212', '#14532d', '#064e3b', '#134e4a', '#164e63', '#0c4a6e', '#1e3a8a', '#312e81', '#4c1d95', '#581c87', '#701a75', '#881337']
        };

        function renderPalettes() {
            const createBox = (color) => {
                const div = document.createElement('div');
                div.className = 'w-8 h-8 rounded-md palette-color border border-black/10';
                div.style.backgroundColor = color;
                div.title = color;
                div.onclick = () => {
                    updateFromExternalCode(color, 'palette');
                    showToast(`${color} 선택됨`, 'info');
                };
                return div;
            };
            palettes.basic.forEach(c => document.getElementById('basicPalette').appendChild(createBox(c)));
            palettes.pastel.forEach(c => document.getElementById('pastelPalette').appendChild(createBox(c)));
            palettes.dark.forEach(c => document.getElementById('darkPalette').appendChild(createBox(c)));
        }

        // 복사 및 토스트
        function copyToClipboard(type) {
            let text = '', label = '';
            if(type === 'hex') { text = '#' + hexInput.value; label = 'HEX'; }
            else if(type === 'rgb') { text = rgbInput.value; label = 'RGB'; }
            else if(type === 'hsl') { text = hslInput.value; label = 'HSL'; }
            else if(type === 'hsv') { text = hsvInput.value; label = 'HSV'; }

            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`${label} 코드가 복사되었습니다: ${text}`, 'success');
            } catch (err) {
                showToast('복사에 실패했습니다.', 'error');
            }
            document.body.removeChild(tempInput);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = 'bg-white', borderClass = 'border-l-4 border-indigo-500';
            let icon = `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            if (type === 'error') {
                borderClass = 'border-l-4 border-red-500';
                icon = `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            }
            toast.className = `flex items-center w-full max-w-xs p-4 space-x-3 text-slate-700 ${bgClass} rounded-lg shadow-lg border-slate-200 border ${borderClass} toast-enter-active`;
            toast.innerHTML = `<div class="inline-flex items-center justify-center shrink-0">${icon}</div><div class="ml-3 text-sm font-medium">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter-active', 'toast-exit-active');
                setTimeout(() => { if(container.contains(toast)) container.removeChild(toast); }, 300);
            }, 2500);
        }

        // 앱 초기화
        window.addEventListener('DOMContentLoaded', () => {
            // 캔버스 크기 초기 할당
            svCanvas.width = svCanvas.offsetWidth;
            svCanvas.height = svCanvas.offsetHeight;
            renderPalettes();
            drawSVMap();
            syncUI();
        });
    </script>
</body>
</html>
