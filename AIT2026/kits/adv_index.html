<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 24px; background: #F5F2FF; color: #3B3355; font-family: 'Noto Sans KR', sans-serif; }
    h1 { margin: 0 0 4px; }
    .sub { color: #6E6787; margin: 0 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chips button { border: 2px solid #E6E1F4; background: #fff; border-radius: 99px; padding: 4px 12px; cursor: pointer; }
    .chips button.on { background: #DCD3FB; border-color: #4D3A9E; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 18px; padding: 14px 16px; border-top: 8px solid var(--c); }
    .card.past { opacity: .45; }
    .card.new { outline: 3px solid #4D3A9E; }
    .dday { float: right; font-weight: bold; background: var(--c); border-radius: 99px; padding: 2px 10px; font-size: 14px; }
    .subject { font-weight: bold; color: #6E6787; font-size: 14px; }
    .title { font-size: 18px; font-weight: bold; margin: 4px 0; }
    .meta { font-size: 14px; color: #6E6787; }
    .add { background: #fff; border: 2px dashed #B9A8F5; border-radius: 18px; padding: 14px 16px; margin-bottom: 16px; }
    .add h2 { margin: 0 0 10px; font-size: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .row label { display: grid; gap: 2px; font-size: 13px; font-weight: bold; }
    .row input { border: 2px solid #E6E1F4; border-radius: 10px; padding: 7px 9px; font-size: 14px; }
    .row button { background: #DCD3FB; border: 2px solid #4D3A9E; border-radius: 99px; padding: 8px 16px; font-weight: bold; cursor: pointer; }
    .msg { font-size: 14px; margin: 8px 0 0; color: #4D3A9E; }
    .error { background: #FFE3EC; color: #7A2148; border-radius: 12px; padding: 10px 14px; }
  </style>
</head>
<body>
  <h1>📅 수행평가 일정 안내판</h1>
  <p class="sub">시트를 고치거나 아래에서 추가하면 이 화면도 바뀌어요.</p>

  <div class="add" id="addBox" hidden>
    <h2>➕ 새 일정 추가 <small style="font-weight:normal;color:#6E6787;">(선생님에게만 보여요)</small></h2>
    <div class="row">
      <label>날짜 <input type="date" id="fDate"></label>
      <label>과목 <input id="fSubject" list="subjects" maxlength="20" placeholder="예: 과학" size="8"></label>
      <label>평가명 <input id="fTitle" maxlength="40" placeholder="예: 전기회로 실험 보고서" size="20"></label>
      <label>준비물 <input id="fPrep" maxlength="40" placeholder="예: 실험 노트" size="12"></label>
      <label>비고 <input id="fNote" maxlength="40" placeholder="예: 모둠별" size="10"></label>
      <button id="fAdd">추가하기</button>
    </div>
    <datalist id="subjects"></datalist>
    <p class="msg" id="msg"></p>
  </div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid">불러오는 중…</div>

  <script>
    const COLORS = ['#FFD3E2', '#FFDCC2', '#FFEEA3', '#C5EDD8', '#C9E3FA', '#DCD3FB', '#C3ECEA', '#F9D2EE'];
    let items = [];
    let pick = '전체';
    let lastAdded = '';

    function dday(dateText) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(dateText + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      return diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : '지남';
    }

    function draw() {
      const subjects = ['전체', ...new Set(items.map(it => it['과목']))];
      const chips = document.getElementById('chips');
      chips.innerHTML = '';
      subjects.forEach(s => {
        const b = document.createElement('button');
        b.textContent = s;
        if (s === pick) b.className = 'on';
        b.onclick = () => { pick = s; draw(); };
        chips.appendChild(b);
      });

      const list = document.getElementById('subjects');
      list.innerHTML = '';
      subjects.slice(1).forEach(s => { const o = document.createElement('option'); o.value = s; list.appendChild(o); });

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      items
        .filter(it => pick === '전체' || it['과목'] === pick)
        .sort((a, b) => a['날짜'].localeCompare(b['날짜']))
        .forEach(it => {
          const card = document.createElement('div');
          const d = dday(it['날짜']);
          const key = it['날짜'] + it['평가명'];
          card.className = 'card' + (d === '지남' ? ' past' : '') + (key === lastAdded ? ' new' : '');
          card.style.setProperty('--c', COLORS[subjects.indexOf(it['과목']) % COLORS.length]);
          card.innerHTML = '<span class="dday"></span><div class="subject"></div><div class="title"></div><div class="meta"></div>';
          card.querySelector('.dday').textContent = d;
          card.querySelector('.subject').textContent = it['과목'] + ' · ' + it['날짜'];
          card.querySelector('.title').textContent = it['평가명'];
          card.querySelector('.meta').textContent = '준비물: ' + (it['준비물'] || '-') + (it['비고'] ? ' / ' + it['비고'] : '');
          grid.appendChild(card);
        });
    }

    function show(data) {
      items = data.items;
      document.getElementById('addBox').hidden = !data.canEdit;
      draw();
    }

    function fail(err) {
      document.getElementById('grid').innerHTML = '<div class="error"></div>';
      document.querySelector('#grid .error').textContent = '⚠️ ' + err.message;
    }

    document.getElementById('fAdd').onclick = () => {
      const form = {
        date: document.getElementById('fDate').value,
        subject: document.getElementById('fSubject').value,
        title: document.getElementById('fTitle').value,
        prep: document.getElementById('fPrep').value,
        note: document.getElementById('fNote').value
      };
      const msg = document.getElementById('msg');
      msg.textContent = '시트에 적는 중…';
      google.script.run
        .withSuccessHandler(data => {
          lastAdded = form.date + form.title.trim();
          msg.textContent = '추가했어요! 🎉 시트 맨 아래에도 한 줄 생겼어요.';
          ['fTitle', 'fPrep', 'fNote'].forEach(id => { document.getElementById(id).value = ''; });
          pick = '전체';
          show(data);
        })
        .withFailureHandler(err => { msg.textContent = '⚠️ ' + err.message; })
        .addSchedule(form);
    };

    google.script.run.withSuccessHandler(show).withFailureHandler(fail).getSchedule();
  </script>
</body>
</html>
