<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 중입니다</title>
<meta name="description" content="곧 문을 엽니다.">
<!-- 외부 폰트·CDN을 일부러 하나도 쓰지 않았습니다. 학교 네트워크에서 이 페이지가 열리면 도메인 허용이 제대로 됐다는 뜻입니다. -->
<style>
  :root{
    --paper:#EDF0EA;
    --ink:#1E3A34;
    --ink-soft:#5C7069;
    --brass:#A9853F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:2rem 1.5rem;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo',Georgia,'Batang',serif;
    -webkit-font-smoothing:antialiased;
  }
  main{
    max-width:30rem;
    text-align:center;
  }
  h1{
    margin:0;
    font-size:clamp(2.2rem,7vw,3.4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1.25;
  }
  .rule{
    width:100%;
    height:1px;
    margin:2rem auto 1.75rem;
    background:var(--brass);
    transform:scaleX(0);
    transform-origin:center;
    animation:draw 1.1s cubic-bezier(.22,.61,.36,1) .25s forwards;
  }
  @keyframes draw{to{transform:scaleX(1);}}
  p{
    margin:0;
    font-size:1.05rem;
    line-height:1.85;
    color:var(--ink-soft);
  }
  footer{
    margin-top:3.5rem;
    font-size:.85rem;
    color:var(--ink-soft);
    opacity:.75;
  }
  @media (prefers-reduced-motion:reduce){
    .rule{animation:none;transform:scaleX(1);}
  }
</style>
</head>
<body>
  <main>
    <h1>준비 중입니다</h1>
    <div class="rule"></div>
    <p>수업에서 쓸 것들을 이곳에 하나씩 올려 둘 예정입니다.<br>조금만 기다려 주세요.</p>
    <footer>기몬</footer>
  </main>
</body>
</html>
